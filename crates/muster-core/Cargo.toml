[package]
name = "muster-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust logic for Muster. No Tauri dependency, testable with plain `cargo test`."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# vault (M0 0.4) — xem giải thích ở [workspace.dependencies] trong Cargo.toml gốc.
argon2.workspace = true
sha2.workspace = true
crypto_secretbox.workspace = true
zeroize.workspace = true
getrandom.workspace = true

# settings (M0 0.6)
toml.workspace = true

# import (M0 0.7)
zip.workspace = true

# logging (M0 0.8)
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true

# Hợp đồng type với nhánh UI (M0 0.5). Để sau feature flag chứ không bật mặc định: `muster-core`
# là crate logic thuần, `muster-cli` dùng nó mà không cần tới specta, và specta v2 hiện vẫn là
# release candidate. Chỉ `muster-app/src-tauri` bật feature này.
specta = { workspace = true, optional = true }

[features]
default = []
# Bật derive `specta::Type` cho các type là hợp đồng với UI (Account, Branch, Format).
specta = ["dep:specta"]
