[package]
name = "muster-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless command line interface for Muster."

[[bin]]
name = "muster-cli"
path = "src/main.rs"

[dependencies]
# Bật adapter `reqwest` để CLI có đường gọi Roblox thật (đăng nhập, lấy auth ticket). Feature chỉ
# được bật ở đây chứ không bật mặc định trong `muster-core`, để crate đó vẫn nhẹ khi test riêng.
muster-core = { workspace = true, features = ["http-reqwest"] }
muster-api.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
