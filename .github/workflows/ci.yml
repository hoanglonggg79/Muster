# CI cho <PROJECT>.
#
# Hai job tách rời vì chúng có hai cây phụ thuộc khác nhau và hỏng vì hai lý do khác nhau.
#
# Lưu ý quan trọng về `cargo test`: phải loại trừ `muster-app`. Test binary của crate đó không
# nạp được trên Windows (rủi ro #17 trong ROADMAP.md), nên `cargo test --workspace` sẽ đổ dù code
# đúng. Việc loại trừ này hợp lý về kiến trúc: nguyên tắc bất biến #3 nói `muster-app` chỉ chứa
# command wrapper, không có logic gì để test.
#
# Bù lại, job Rust có một bước kiểm tra bindings TypeScript còn khớp với code Rust hay không —
# đúng loại lệch mà mục 6.0-UI muốn chặn.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Rủi ro #16: build script của Tauri đôi khi để lại lock file trong target/, gây
  # "Access is denied". Tắt incremental cho CI để giảm hẳn nguồn lock.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust kèm rustfmt và clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Định dạng
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Loại trừ muster-app — xem ghi chú đầu file.
      - name: Test
        run: cargo test --workspace --exclude muster-app

      - name: Bindings TypeScript còn khớp với code Rust
        run: |
          cargo run -p muster-app --bin muster-codegen
          git diff --exit-code -- crates/muster-app/src/bindings.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/muster-app
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/muster-app/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Build
        run: npm run build
