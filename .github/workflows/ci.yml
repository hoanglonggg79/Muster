# CI cho Muster.
#
# Hai job tách rời vì chúng có hai cây phụ thuộc khác nhau và hỏng vì hai lý do khác nhau.
#
# `cargo test` chạy cả `muster-app`: lỗi nạp test binary của crate đó trên Windows (rủi ro #17) đã
# được kiểm chứng lại ngày 2026-10-11 là KHÔNG còn tái hiện, nên không cần loại trừ.
# Nếu gặp "Access is denied (os error 5)" trong target/debug/build/... thì đó là lỗi khoá/tranh chấp
# file (rủi ro #16) — không phải lỗi code; CARGO_INCREMENTAL=0 bên dưới đã giảm nguồn lock cho CI.
# Cả hai mã #16/#17 nay nằm ở ROADMAP.md §6.1.
#
# Job Rust có một bước kiểm tra bindings TypeScript còn khớp với code Rust hay không — đúng loại
# lệch mà ROADMAP.md §2.9 muốn chặn. Job Frontend chạy typecheck, lint (Biome) rồi build.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Rủi ro #16: build script của Tauri đôi khi để lại lock file trong target/, gây
  # "Access is denied". Tắt incremental cho CI để giảm hẳn nguồn lock.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust kèm rustfmt và clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Định dạng
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Bindings TypeScript còn khớp với code Rust
        run: |
          cargo run -p muster-app --bin muster-codegen
          git diff --exit-code -- crates/muster-app/src/bindings.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/muster-app
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/muster-app/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
